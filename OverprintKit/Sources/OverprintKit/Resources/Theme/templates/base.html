<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% block head_top %}{% endblock %}
<title>{% block title %}{{ site.title }}{% endblock %}</title>
{% if description %}<meta name="description" content="{{ description }}">
<meta property="og:description" content="{{ description }}">
{% endif %}<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
{{ theme.fontLink }}
{{ theme.rootStyle }}
{% include "head.html" %}
</head>
<body>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
<span>&copy; {{ year }} {{ site.author }}</span>
<span><a class="built-with" href="https://overprint.mcavus.com/" rel="noopener">Built with Overprint</a></span>
</footer>
</body>
</html>
