name: Examples

# Builds the three bundled example sites and publishes them to gh-pages, so the README can link to
# something live. Nothing generated is ever committed to main: this job builds into a temp directory
# and force-pushes that as a single commit, the same shape as the app's own Deploy.
#
# Published at https://overprint.mcavus.com/, with the examples at /<name>/.
#
# One-time setup: Settings > Pages > Source: Deploy from a branch > gh-pages > / (root), plus a
# CNAME record for `overprint` pointing at mcavus.github.io. The custom domain needs no setting
# in the UI: GitHub reads the CNAME file this job writes.

on:
  push:
    branches: [main]
    # Only the things that can change what the sites look like.
    paths:
      - "OverprintKit/Sources/OverprintKit/Resources/Examples/**"
      - "OverprintKit/Sources/OverprintKit/Resources/Theme/**"
      - "OverprintKit/Sources/OverprintKit/Engine/**"
      - ".github/workflows/examples.yml"
      - ".github/landing.html"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: examples
  cancel-in-progress: true

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build the CLI
        run: swift build --package-path OverprintKit -c release --product overprint

      - name: Build each example
        env:
          # The site has its own domain, so it lives at the root rather than under /overprint/.
          # This matters: the sitemap, the feed, and the 404 page's <base> all derive from `url`,
          # and the bundled examples carry example.com placeholders that would be wrong here.
          SITE_ROOT: https://overprint.mcavus.com
          SITE_DOMAIN: overprint.mcavus.com
        run: |
          set -euo pipefail
          CLI="$(swift build --package-path OverprintKit -c release --show-bin-path)/overprint"
          EXAMPLES=OverprintKit/Sources/OverprintKit/Resources/Examples
          OUT="$RUNNER_TEMP/site"
          mkdir -p "$OUT"

          for name in starter changelog journal; do
            work="$RUNNER_TEMP/build-$name"
            rm -rf "$work"
            cp -R "$EXAMPLES/$name" "$work"

            # Point the site at where it will actually be served. Replace rather than append, so a
            # placeholder url in the example does not survive alongside the real one.
            grep -v '^url:' "$work/overprint.yml" > "$work/overprint.yml.tmp"
            echo "url: $SITE_ROOT/$name" >> "$work/overprint.yml.tmp"
            mv "$work/overprint.yml.tmp" "$work/overprint.yml"

            "$CLI" validate "$work"
            "$CLI" build "$work"
            mkdir -p "$OUT/$name"
            cp -R "$work/dist/." "$OUT/$name/"
          done

          # These are fictional blogs. They exist to be looked at, not to compete with real writing
          # in search results, so keep them out of the index. This runs BEFORE the landing page is
          # copied in below, which is deliberate: the landing page SHOULD be indexed. Reversing
          # these two steps would quietly de-index it, so the check step asserts both directions.
          find "$OUT" -name '*.html' -exec \
            perl -pi -e 's{<head>}{<head>\n<meta name="robots" content="noindex">}' {} +

          # The landing page, with the images the README already uses.
          cp .github/landing.html "$OUT/index.html"
          mkdir -p "$OUT/img"
          cp docs/logo.png docs/logo-dark.png \
             docs/screenshot-hero.png docs/screenshot-build.png \
             docs/screenshot-write.png "$OUT/img/"
          cp overprint-logos/overprint-mark.png "$OUT/img/mark.png"
          # Without this, Pages runs the output through Jekyll.
          touch "$OUT/.nojekyll"

          # The custom domain lives in this file, not in a GitHub setting. This job force-pushes
          # gh-pages from a fresh git init, so anything the Pages UI writes to that branch is
          # destroyed on the next run. Writing it ourselves is what makes the domain survive.
          echo "$SITE_DOMAIN" > "$OUT/CNAME"

      - name: Check the build actually produced what we expect
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/site"
          for name in starter changelog journal; do
            test -f "$OUT/$name/index.html" || { echo "$name: no index.html" >&2; exit 1; }
            test -f "$OUT/$name/404.html"   || { echo "$name: no 404.html" >&2; exit 1; }
            grep -q 'name="robots" content="noindex"' "$OUT/$name/index.html" \
              || { echo "$name: index.html is missing the noindex tag" >&2; exit 1; }
            # The 404 is served from arbitrary paths, so its <base> has to name the site root.
            grep -q "<base href=\"/$name/\">" "$OUT/$name/404.html" \
              || { echo "$name: 404.html has the wrong <base>" >&2; exit 1; }
          done
          test -f "$OUT/index.html"
          # The landing page is useless with broken images, and a missing file here is silent.
          for img in logo logo-dark screenshot-hero screenshot-build screenshot-write mark; do
            test -s "$OUT/img/$img.png" || { echo "missing img/$img.png" >&2; exit 1; }
          done
          grep -q "star" "$OUT/index.html" || { echo "landing page lost its content" >&2; exit 1; }
          # The landing page is the one page here that should reach search results.
          grep -q 'name="robots" content="noindex"' "$OUT/index.html" \
            && { echo "landing page picked up a noindex tag" >&2; exit 1; } || true
          # Losing this file silently drops the custom domain on the next publish.
          grep -qx "overprint.mcavus.com" "$OUT/CNAME" \
            || { echo "CNAME missing or wrong; the custom domain would be lost" >&2; exit 1; }

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/site"
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish examples from ${GITHUB_SHA:0:7}"
          # A single-commit force push: this branch is disposable output, not history.
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
